[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugaunet"
version = "0.1.0"
description = "UGA-UNet: Lightweight Segmentation with Uncertainty-Guided Boundary Anchoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "opencv-python>=4.8",
  "albumentations>=1.3,<3",
  "Pillow>=10",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "PyYAML>=6.0",
  "thop>=0.1.1",
]

[tool.setuptools.packages.find]
include = ["ugaunet*"]
